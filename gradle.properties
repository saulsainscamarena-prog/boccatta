# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# ===== MEMORIA PARA GRADLE DAEMON (CRITICO) =====
# 512m era insuficiente: causaba OOM nativo por falta de espacio de metadatos.
# Con G1GC (mejor manejo de memoria nativa que ParallelGC) y 1536m de heap
# el daemon deberia estabilizarse sin agotar el espacio de direcciones de 4GB.
# Si crashea de nuevo, probar -XX:-UseCompressedOops o agrandar pagefile.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8

# ===== MEMORIA PARA COMPILADOR KOTLIN =====
# 1024m alcanza para la mayoria de compilaciones. G1GC reemplaza default (ParallelGC)
# para mejor manejo de memoria nativa en Windows.
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC

# ===== PARALELISMO Y CACHE =====
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# ===== ANDROID CONFIG =====
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# ===== R8 FULL MODE =====
android.enableR8.fullMode=true

# ===== KOTLIN STYLE =====
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
