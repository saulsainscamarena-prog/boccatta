# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# ===== MEMORIA PARA GRADLE DAEMON (CRITICO) =====
# Reducido de 4096m a 512m para evitar OOM nativo en maquina de 15GB
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# ===== MEMORIA PARA COMPILADOR KOTLIN =====
# 1024m - 512m no alcanza para el proyecto (Not enough memory to run compilation)
# 2048m causaba OOM nativo combinado con Android Studio y Edge
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m

# ===== PARALELISMO Y CACHE =====
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.configureondemand=true

# ===== ANDROID CONFIG =====
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# ===== R8 FULL MODE =====
android.enableR8.fullMode=true

# ===== KOTLIN STYLE =====
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
