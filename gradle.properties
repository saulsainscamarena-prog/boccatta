# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# ===== MEMORIA PARA GRADLE DAEMON (CR�TICO) =====
# Aumentado de 1024m a 4096m para soportar D8/R8, KSP y Room
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# ===== MEMORIA PARA COMPILADOR KOTLIN =====
# Aumentado de 512m a 2048m para evitar OOM en compilaci�n con KSP
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# ===== PARALELISMO Y CACH� =====
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# ===== ANDROID CONFIG =====
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# ===== R8 FULL MODE =====
android.enableR8.fullMode=true

# ===== KOTLIN STYLE =====
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
