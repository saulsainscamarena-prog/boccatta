# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# ===== MEMORIA PARA GRADLE DAEMON (CRITICO) =====
# Reducido de 4096m a 2048m para evitar OOM nativo en maquina de 15GB
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# ===== MEMORIA PARA COMPILADOR KOTLIN =====
# Reducido de 2048m a 1024m para evitar OOM nativo en maquina de 15GB
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m

# ===== PARALELISMO Y CACHE =====
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# ===== ANDROID CONFIG =====
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# ===== R8 FULL MODE =====
android.enableR8.fullMode=true

# ===== KOTLIN STYLE =====
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
