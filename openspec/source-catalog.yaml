version: 1
description: Preferred external sources for Bocatta SDD research. Use local code first, then these sources only when the topic is external, unstable, or version-sensitive.

rules:
  local_first:
    - AGENTS.md
    - openspec/constitution.md
    - openspecfig.yaml
    - openspec/skill-registry.yaml
    - Gradle files and local source owners
  prefer_primary_sources: true
  avoid:
    - random_blog_as_primary_source
    - outdated_stackoverflow_answer_without_version_check
    - broad_web_search_without_question
    - copying_code_without_license_review

sources:
  android_compose:
    official:
      - label: Android Jetpack Compose docs
        url: https://developer.android.com/develop/ui/compose/documentation
      - label: Compose releases
        url: https://developer.android.com/jetpack/androidx/releases/compose
    use_when:
      - compose_api_changed
      - material3_behavior_unclear
      - adaptive_ui_or_insets
      - performance_guidance_needed

  android_architecture:
    official:
      - label: Android app architecture guide
        url: https://developer.android.com/topic/architecture
      - label: Android lifecycle docs
        url: https://developer.android.com/topic/libraries/architecture/lifecycle
    use_when:
      - lifecycle_or_viewmodel_behavior_unclear
      - recommended_architecture_changed

  room_sqlite:
    official:
      - label: Room documentation
        url: https://developer.android.com/training/data-storage/room
      - label: SQLite Android documentation
        url: https://developer.android.com/training/data-storage/sqlite
    use_when:
      - migration_behavior
      - transaction_or_query_semantics
      - offline_persistence_storage_question

  workmanager:
    official:
      - label: WorkManager documentation
        url: https://developer.android.com/topic/libraries/architecture/workmanager
    use_when:
      - retry_policy
      - background_limits
      - constraints
      - foreground_background_behavior

  firebase_firestore:
    official:
      - label: Firestore Android documentation
        url: https://firebase.google.com/docs/firestore
      - label: Firestore offline data
        url: https://firebase.google.com/docs/firestore/manage-data/enable-offline
      - label: Firestore security rules
        url: https://firebase.google.com/docs/rules
    use_when:
      - offline_cache_behavior
      - transaction_or_batch_behavior
      - security_rules_impact
      - sdk_behavior_changed

  kotlin_coroutines:
    official:
      - label: Kotlin coroutines guide
        url: https://kotlinlang.org/docs/coroutines-overview.html
      - label: Android coroutines guide
        url: https://developer.android.com/kotlin/coroutines
    use_when:
      - concurrency
      - cancellation
      - dispatcher_or_scope_choice
      - checkout_race_condition

  gradle_android:
    official:
      - label: Gradle User Manual
        url: https://docs.gradle.org/
      - label: Gradle Java Toolchains
        url: https://docs.gradle.org/current/userguide/toolchains.html
      - label: Android Gradle Plugin release notes
        url: https://developer.android.com/build/releases/gradle-plugin
    use_when:
      - build_failure_not_explained_locally
      - jdk_or_toolchain_question
      - version_catalog_or_agp_change

  koin:
    official:
      - label: Koin documentation
        url: https://insert-koin.io/docs/
      - label: Koin Android documentation
        url: https://insert-koin.io/docs/reference/koin-android/start/
    use_when:
      - dependency_injection_pattern_unclear
      - koin_version_behavior
      - module_wiring_issue

  google_play_release:
    official:
      - label: Android app quality guidelines
        url: https://developer.android.com/docs/quality-guidelines
      - label: Google Play Console Help
        url: https://support.google.com/googleplay/android-developer/
    use_when:
      - target_sdk_policy
      - release_requirement
      - store_listing_or_play_compliance

  security_privacy:
    official:
      - label: Android security best practices
        url: https://developer.android.com/privacy-and-security/security-best-practices
      - label: OWASP MASVS
        url: https://mas.owasp.org/MASVS/
    use_when:
      - auth_roles
      - sensitive_pos_data
      - exported_components
      - credential_or_secret_handling
