phase_mapping:
  research:
    read:
      - skill_registry_entry_only
      - relevant_skill_headers
    purpose: Select the smallest skill set before reading full skill docs.
  proposal:
    read:
      - relevant_full_skills
    purpose: Identify scope, owners, risks, and verification before design.
  spec:
    read:
      - business_domain_skills
      - testing_skill_if_behavioral
    purpose: Convert behavior to Given/When/Then scenarios.
  design:
    read:
      - architecture_skill
      - domain_specific_skills
      - testing_skill
    purpose: Map requirements to existing Android owners and contracts.
  tasks:
    read:
      - testing_skill
      - gradle_skill_if_verification_needed
    purpose: Break into small implementation and verification tasks.
  apply:
    read:
      - only_skills_needed_for_current_task
    purpose: Avoid context pollution while editing.
  review:
    read:
      - architecture_skill_if_boundary_changed
      - testing_skill
      - security_skill_if_sensitive
    purpose: Audit implementation against spec/design/tasks.
  verify:
    read:
      - gradle_skill
      - testing_skill
    purpose: Run the right Windows verification and diagnose failures.

