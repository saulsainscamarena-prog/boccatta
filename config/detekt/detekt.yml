build:
  maxIssues: 100

complexity:
  LongMethod:
    threshold: 40
  LongParameterList:
    functionThreshold: 5
  TooManyFunctions:
    thresholdInClasses: 11

naming:
  FunctionNaming:
    functionPattern: '[a-z][a-zA-Z0-9]*'
  VariableNaming:
    variablePattern: '[a-z][a-zA-Z0-9]*'

style:
  MagicNumber:
    ignoreNumbers: ['-1', '0', '1', '2', '10', '100', '1000']
  WildcardImport:
    active: true
    excludeImports: [
      'java.util.*',
      'androidx.compose.runtime.*',
      'androidx.compose.ui.*',
      'androidx.compose.foundation.*',
      'androidx.compose.foundation.layout.*',
      'androidx.compose.foundation.lazy.*',
      'androidx.compose.foundation.shape.*',
      'androidx.compose.material3.*',
      'androidx.compose.material.icons.filled.*',
      'org.junit.Assert.*',
      'com.bocatta.pos.domain.model.*',
      'com.bocatta.pos.presentation.ui.theme.*',
      'com.bocatta.pos.presentation.viewmodel.*',
      'androidx.work.*'
    ]

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
